# Optional override; Compose >= 2.24.4 (!override).
services:
  gateway:
    ports: !reset []
    networks: !override [publication, tls-upstream]
    environment:
      HMC_PUBLIC_ORIGIN: ${HMC_TLS_ORIGIN:?set external HTTPS origin}
  viewer:
    ports: !reset []
    networks: !override [publication, tls-upstream]
  tls-proxy:
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    networks: [edge, tls-upstream]
    ports: ["${HMC_TLS_BIND:-0.0.0.0}:${HMC_TLS_PORT:-443}:8443"]
    volumes:
      - type: bind
        source: ${HMC_TLS_CERT_DIR:?set directory with fullchain.pem and privkey.pem}
        target: /certs
        read_only: true
        bind: {create_host_path: false}
      - ./publication/tls/nginx.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
networks:
  tls-upstream:
    internal: true
