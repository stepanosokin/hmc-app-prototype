services:
  worker:
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      PUBLICATION_STORAGE_BYTES: '68719476736'
  api:
    cpus: 4
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      T19_PROFILE: '1'
      PUBLICATION_STORAGE_BYTES: '68719476736'
  gateway:
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
  db:
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
  geoserver:
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
  viewer:
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
  check:
    volumes:
      - ./tools:/app/tools:ro
    cpus: 2
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      PUBLICATION_STORAGE_BYTES: '68719476736'
