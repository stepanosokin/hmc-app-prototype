pid /tmp/nginx.pid;
# Always reread certificates, including rapid rollback with unchanged inode/mtime.
ssl_object_cache_inheritable off;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    # Upstream error messages include request URLs; credentials must never enter logs.
    error_log /dev/null;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    server {
        listen 8443 ssl;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /certs/fullchain.pem;
        ssl_certificate_key /certs/privkey.pem;
        ssl_session_tickets off;
        proxy_read_timeout 100s;
        proxy_connect_timeout 3s;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Publication-Prefix "";
        location ~ ^/(org(?:/|$)|api/|ogc(?:/|$)|gis/|health$) {
            set $gateway http://gateway:8000;
            proxy_pass $gateway;
        }
        location / {
            set $viewer http://viewer:8000;
            proxy_pass $viewer;
        }
    }
}
